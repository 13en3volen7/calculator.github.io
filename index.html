<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator.github.io</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div id="header">Calculator</div>
    <div id="container">
        <div class="displayer"></div>
        <div class="options">
            <div class="row first">
                <button class="zero">&#48</button>
                <button class="dot">&#8901</button>
                <button class="equal">&#61</button>
            </div>
            <div class="row second">
                <button class="one">&#49</button>
                <button class="two">&#50</button>
                <button class="three">&#51</button>
                <button class="plus">&#43</button>
            </div>
            <div class="row second">
                <button class="four">&#52</button>
                <button class="five">&#53</button>
                <button class="six">&#54</button>
                <button class="minus">&#8722</button>
            </div>
            <div class="row third">
                <button class="seven">&#55</button>
                <button class="eight">&#56</button>
                <button class="nine">&#57</button>
                <button class="multiply">&#215</button>
            </div>
            <div class="row forth">
                <button class="clear-entry">CE</button>
                <button class="all-clear">AC</button>
                <button class="divide">&#247</button>
            </div>
        </div>
    </div>
    <div id="footer"></div>
</body>
</html>
