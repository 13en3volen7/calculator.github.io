<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator.github.io</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div id="header">Calculator</div>
    <div id="container">
        <div class="display">
            <span class="content"></span>
        </div>
        <div class="options">
            <div class="row first">
                <button class="plus-minus">±</button>
                <button class="number-0">&#48</button>
                <button class="decimal">&#8901</button>
                <button class="equal">&#61</button>
            </div>
            <div class="row second">
                <button class="number-1">&#49</button>
                <button class="number-2">&#50</button>
                <button class="number-3">&#51</button>
                <button class="operator-plus">&#43</button>
            </div>
            <div class="row second">
                <button class="number-4">&#52</button>
                <button class="number-5">&#53</button>
                <button class="number-6">&#54</button>
                <button class="operator-minus">&#8722</button>
            </div>
            <div class="row third">
                <button class="number-7">&#55</button>
                <button class="number-8">&#56</button>
                <button class="number-9">&#57</button>
                <button class="operator-multiply">&#215</button>
            </div>
            <div class="row fourth">
                <button class="clear-entry">CE</button>
                <button class="all-clear">AC</button>
                <button class="del">⌫</button>
                <button class="operator-divide">&#247</button>
            </div>
        </div>
    </div>
    <div id="footer">Made by 13en3volen7</div>
</body>
</html>
